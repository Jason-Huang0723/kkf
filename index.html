<title>慈幼山友方案庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Raleway:wght@600;700;800&display=swap">
<style>
/* Layout: forest-green bands (hero, page titles, footer) framing a paper-colored working area; double-rule title boxes echo the reference template */
:root{
  --ground:#23402F; --ground-2:#2F5D46; --ground-3:#3F6B52; --deep:#1A2F23; --on-ground:#F3F1E7; --on-ground-dim:#C9D6CD;
  --paper:#F3F1E7; --card:#FFFFFF; --card-2:#F7F8F4; --ink:#1E2A24; --ink-2:#3A4A41; --head:#23402F; --link:#2F5D46;
  --line:#E2E6DE; --chip-line:#9DB8A6; --accent:#2D5D94; --accent-bg:#E6EEF7; --warn:#8A4B12; --warn-bg:#FBEBD9; --focus:#9DB8A6;
  --hatch:rgba(255,255,255,.045); --hatch-light:rgba(35,64,47,.06);
  --f-body:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif; --f-latin:'Raleway','Noto Sans TC',sans-serif;
  --map-sea:var(--card); --map-land:#DCE5D6; --map-hi:#B9CDBE; --map-route:#23402F; --map-pin:#B4513B; --map-ink:var(--ink); --map-ink-2:var(--ink-2);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#1B3326; --ground-2:#24493A; --ground-3:#2D5642; --deep:#0F1C14; --on-ground:#F3F1E7; --on-ground-dim:#B8C9BD;
  --paper:#142219; --card:#1C2E23; --card-2:#22372A; --ink:#E6EDE7; --ink-2:#B9C8BE; --head:#CFE3D5; --link:#9FD0B2;
  --line:#2C4334; --chip-line:#4F6E5B; --accent:#A9C8EE; --accent-bg:#22344A; --warn:#F2C08F; --warn-bg:#3A2A18; --focus:#6E9A80;
  --hatch:rgba(255,255,255,.035); --hatch-light:rgba(255,255,255,.03); --map-land:#27402F; --map-hi:#3A5C47; --map-route:#9FD0B2; --map-pin:#E0795C; color-scheme:dark }}
:root[data-theme="dark"]{
  --ground:#1B3326; --ground-2:#24493A; --ground-3:#2D5642; --deep:#0F1C14; --on-ground:#F3F1E7; --on-ground-dim:#B8C9BD;
  --paper:#142219; --card:#1C2E23; --card-2:#22372A; --ink:#E6EDE7; --ink-2:#B9C8BE; --head:#CFE3D5; --link:#9FD0B2;
  --line:#2C4334; --chip-line:#4F6E5B; --accent:#A9C8EE; --accent-bg:#22344A; --warn:#F2C08F; --warn-bg:#3A2A18; --focus:#6E9A80;
  --hatch:rgba(255,255,255,.035); --hatch-light:rgba(255,255,255,.03); --map-land:#27402F; --map-hi:#3A5C47; --map-route:#9FD0B2; --map-pin:#E0795C; color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding-inline:16px;width:100%}
.hatch{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 14px)}
.hatch-light{background-image:repeating-linear-gradient(135deg,var(--hatch-light) 0 1px,transparent 1px 16px)}
#view{flex:1}

.top{background-color:var(--ground);color:var(--on-ground)}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:12px 24px;padding-block:18px}
.brand{display:flex;align-items:center;gap:12px;color:var(--on-ground);text-decoration:none}
.brand .ava{width:38px;height:38px;border-radius:50%;overflow:hidden;border:2px solid var(--on-ground);background:transparent;flex:none}
.brand .ava img{width:100%;height:100%;object-fit:contain;padding:3px;display:block}
.brand b{font-weight:700;letter-spacing:.18em;font-size:15px}
.links{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:14px;letter-spacing:.12em}
.links a{color:var(--on-ground);text-decoration:none;padding-block:6px;border-bottom:2px solid transparent}
.links a:hover{border-bottom-color:var(--on-ground-dim)}
.links a[aria-current="page"]{border-bottom-color:var(--on-ground);font-weight:700}
.links .soon{color:var(--on-ground-dim);padding-block:6px}

.rule-title{display:inline-block;padding:12px 24px;border-top:7px double var(--on-ground);border-bottom:7px double var(--on-ground);font-weight:900;letter-spacing:.22em;line-height:1.25}
.band{text-align:center;padding-block:20px 44px;display:flex;flex-direction:column;align-items:center;gap:14px}
.band .rule-title{font-size:clamp(26px,4.4vw,44px)}
.band p{letter-spacing:.06em;color:var(--on-ground);max-width:40em}
.crumb{font-size:13px;letter-spacing:.12em;color:var(--on-ground-dim)}
.crumb a{color:var(--on-ground-dim)}
.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 22px;font-size:15px;letter-spacing:.06em;color:var(--on-ground);font-variant-numeric:tabular-nums}

.hero{padding-block:56px 96px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.mascot{width:156px;height:156px;border-radius:50%;overflow:hidden;background:#C9D9C8;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.mascot img{width:100%;height:100%;object-fit:contain;padding:20px;display:block}
.hero h1{font-size:clamp(32px,6vw,62px);letter-spacing:.24em}
.latin{font-family:var(--f-latin);font-weight:700;letter-spacing:.5em;font-size:18px}
.hero .tag{font-size:18px;line-height:1.8;letter-spacing:.08em;max-width:560px}
.hero-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}

body[data-view="home"] .hero{min-height:calc(100svh - 96px);justify-content:center;padding-block:40px 72px}
body[data-view="home"] .hero > *{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both;text-shadow:0 2px 14px rgba(0,0,0,.35)}
body[data-view="home"] .hero > :nth-child(1){animation-delay:.15s}
body[data-view="home"] .hero > :nth-child(2){animation-delay:.55s}
body[data-view="home"] .hero > :nth-child(3){animation-delay:.95s}
body[data-view="home"] .hero > :nth-child(4){animation-delay:1.3s}
body[data-view="home"] .btn-ghost{text-shadow:none;backdrop-filter:blur(2px)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

.btn-ghost{display:inline-block;padding:13px 32px;border:2px solid var(--on-ground);color:var(--on-ground);text-decoration:none;font-weight:700;letter-spacing:.24em;font-size:15px;background:transparent;cursor:pointer}
.btn-ghost:hover{background:var(--on-ground);color:var(--ground)}
.btn-ghost.solid{background:var(--on-ground);color:var(--ground)}
.btn-ghost.solid:hover{background:transparent;color:var(--on-ground)}
.btn-line{display:inline-block;padding:10px 22px;border:2px solid var(--link);color:var(--link);text-decoration:none;font-weight:700;letter-spacing:.16em;font-size:14px;text-align:center}
.btn-line:hover{background:var(--link);color:var(--card)}

.main{padding-block:40px 88px}
.cols{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.colmain{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:22px}
.colside{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:22px}
.box{background:var(--card);padding:28px clamp(20px,4vw,34px);display:flex;flex-direction:column;gap:14px}
.box h2{font-size:19px;letter-spacing:.18em;color:var(--head)}
.box ul{margin:0;padding-left:20px;color:var(--ink-2);line-height:1.9}
.box p{color:var(--ink-2);line-height:1.9}
.muted{color:var(--ink-2);font-size:14px}
.search{width:100%;padding:11px 14px;min-height:46px;border:1px solid var(--chip-line);background:var(--card);color:var(--ink);font-size:15px;font-family:inherit}
.flabel{font-weight:700;letter-spacing:.12em;color:var(--head);font-size:15px;display:block;margin-bottom:8px}
.pill{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-bg);padding:3px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.count{font-size:15px;color:var(--ink-2)} .count strong{color:var(--head)}
.empty{background:var(--card);padding:36px;text-align:center;color:var(--ink-2)}

/* theme tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;max-width:1080px;margin:0 auto}
.tile{position:relative;z-index:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:0;min-height:150px;padding:20px 24px 18px;background-color:var(--tc);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 1px,transparent 1px 12px);color:var(--on-ground);text-decoration:none;transition:transform .22s cubic-bezier(.2,.8,.3,1.2),box-shadow .22s ease,filter .22s ease}
.tile.s0{--tc:var(--ground)} .tile.s1{--tc:var(--ground-2)} .tile.s2{--tc:var(--ground-3)}
.lib{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.lib .tiles{width:100%;max-width:none;margin:0}
.tile.tile-all{--tc:var(--deep);flex-direction:row;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;min-height:132px;padding:24px 28px 20px;border-radius:14px 14px 0 0}
.tile-all .lead{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile-all h3{font-size:24px;letter-spacing:.22em}
.tile-all .lead span{font-size:14px;color:var(--on-ground-dim);letter-spacing:.06em}
.tile-all .big b{font-size:56px}
.tile.tile-all:hover,.tile.tile-all:focus-visible{transform:scale(1.02)}
.tiles .tile:nth-child(7){border-bottom-left-radius:14px} .tiles .tile:nth-child(9){border-bottom-right-radius:14px}
.tile:hover,.tile:focus-visible{transform:scale(1.07);z-index:2;border-radius:10px;box-shadow:0 18px 36px rgba(10,30,20,.32);filter:brightness(1.12)}
.tile:active{transform:scale(1.02)}
.tile h3{font-size:20px;letter-spacing:.18em;line-height:1.35;color:var(--on-ground)}
.tile .big{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.tile .big b{font-family:var(--f-latin);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.tile .big span{font-size:13px;color:var(--on-ground-dim)}
@media (max-width:560px){ .tile{min-height:112px;padding:14px 12px 12px;gap:8px} .tile h3{font-size:15px;letter-spacing:.06em} .tile .big b{font-size:30px} .tile .big span{font-size:12px} .tile.tile-all{min-height:100px;padding:16px 16px 14px;border-radius:10px 10px 0 0} .tile-all h3{font-size:18px;letter-spacing:.12em} .tile-all .lead span{font-size:12px} .tile-all .big b{font-size:38px} .tiles .tile:nth-child(7){border-bottom-left-radius:10px} .tiles .tile:nth-child(9){border-bottom-right-radius:10px} }

/* plan cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:10px;background:var(--card);color:var(--ink);text-decoration:none;padding:22px;transition:transform .15s ease,box-shadow .15s ease}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(10,30,20,.16)}
.pcard .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--link)}
.pcard h3{font-size:19px;letter-spacing:.06em;color:var(--head)}
.pcard p{font-size:14px;line-height:1.75;color:var(--ink-2);flex:1}
.termhead{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--chip-line);padding-bottom:6px}
.termhead h2{font-size:20px;letter-spacing:.14em;color:var(--head)}

.sim{display:flex;flex-direction:column;gap:2px;background:var(--card-2);padding:12px 16px;text-decoration:none;color:var(--ink)}
.sim:hover{outline:2px solid var(--chip-line)}
.sim b{color:var(--head)} .sim span{font-size:13px;color:var(--ink-2)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 13px;min-height:42px;font-size:14px;border:1px solid var(--chip-line);background:var(--card);color:var(--link);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--head)}
.chip[aria-pressed="true"]{background:var(--ground);border-color:var(--ground);color:var(--on-ground);font-weight:700}
.chip small{font-size:12px;opacity:.8;font-variant-numeric:tabular-nums}

/* plan table */
.tbl-wrap{overflow-x:auto;background:var(--card);-webkit-overflow-scrolling:touch}
.tbl-wrap table{border-collapse:collapse;width:100%}
.tbl-wrap th,.tbl-wrap td{padding:12px 11px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tbl-wrap thead th{background:var(--card-2);font-size:13px;letter-spacing:.08em;color:var(--head);white-space:nowrap;font-weight:700}
.tbl-wrap tbody tr:hover td{background:var(--card-2)}
.tbl-wrap td.term{color:var(--head);font-variant-numeric:tabular-nums;white-space:nowrap;width:4.6em}
.tbl-wrap td.term b{display:block;font-size:17px;line-height:1.3}
.tbl-wrap td.term span{display:block;font-size:12px;color:var(--ink-2);margin-top:2px}
.tbl-wrap td.name{min-width:7.5em;max-width:13em}
.tbl-wrap td.name a{display:block;font-weight:700;color:var(--head);text-decoration:none;font-size:16px;margin-bottom:6px;line-height:1.5}
.tbl-wrap td.name a:hover{text-decoration:underline}
.tbl-wrap td.goal{min-width:12em;color:var(--ink-2);font-size:14px;line-height:1.7}
.tbl-wrap td.tl{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;width:6.5em}
.tbl-wrap td.doccell{white-space:nowrap;width:1%}
.tbl-wrap td.doccell .doclink{display:flex;padding:2px 0 6px}
.nowrap{white-space:nowrap}
.tagcell span{display:inline-block;margin:0 8px 4px 0;font-size:13px;color:var(--link);white-space:nowrap}
.tbl-wrap .tagcell{max-width:9em}
@media (max-width:760px){
  .ptable thead{display:none}
  .ptable,.ptable tbody{display:block}
  .ptable tr{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px 4px;border-bottom:1px solid var(--line)}
  .ptable td{display:block;border:0;padding:0;width:auto!important;max-width:none!important;min-width:0!important}
  .ptable td.term{grid-column:1;grid-row:1}
  .ptable td.name{grid-column:2;grid-row:1}
  .ptable td.goal,.ptable td.tagcell,.ptable td.tl,.ptable td.doccell{grid-column:1 / -1}
  .ptable td.tagcell span{margin-bottom:0}
  .ptable td.doccell{display:flex;flex-wrap:wrap;gap:4px 18px}
  .tbl-wrap{padding-inline:12px}
}
.doclink{display:inline-flex;align-items:center;gap:6px;color:var(--link);font-size:14px;font-weight:700;text-decoration:none;padding:6px 0}
.doclink:hover span{text-decoration:underline}
.doclink-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.doclink.alt{color:var(--ink-2);font-weight:500}
.btn-line.alt{border-style:dashed;border-color:var(--chip-line);color:var(--ink-2)}
.btn-line.alt:hover{background:var(--card-2);color:var(--ink)}
.btn-line small{display:block;font-weight:400;font-size:12px;letter-spacing:.02em;opacity:.85;word-break:break-all}
.pill.dim{color:var(--ink-2);background:var(--line)}
.filterbar{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end;background:var(--card);padding:20px clamp(16px,3vw,26px)}
a.chip{text-decoration:none}
footer{background-color:var(--deep);color:var(--on-ground-dim);padding-block:34px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
footer b{color:var(--on-ground);letter-spacing:.2em}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

  const f = p.folder; if (!f || !f.url) return '<span class="muted">—</span>';
  const own = f.kind === 'plan';
  return `<a class="doclink${own ? '' : ' alt'}" href="${esc(f.url)}" target="_blank" rel="noopener" title="${own ? '' : '沒有個別資料夾，開啟該期資料夾：'}${esc(f.name)}">${FOLDER_ICON}<span>${own ? '資料夾' : '該期資料夾'}</span></a>`;
}
function planTable(list) {
  if (!list.length) return '<div class="empty">沒有符合的方案。</div>';
  const rows = list.map(p => {
    const sub = p.term === 37 ? '<span class="pill warn">撰寫中</span>' : '';
    const g = p.goal.length > 60 ? p.goal.slice(0, 60) + '…' : p.goal;
    const tl = [p.mins, p.people].filter(Boolean).join(' / ') || '—';
    const ty = esc(p.type) + (p.site && p.site !== '瑞北' ? `・${esc(p.site)}` : '');
    const links = [p.sheet && p.sheet.url ? sheetLink(p) : '', p.folder && p.folder.url ? folderLink(p) : ''].join('') || '<span class="muted">—</span>';
    return `<tr><td class="term"><b>${termShort(p.term)}</b><span>${ty}</span></td>
      <td class="name"><a href="#p-${p.id}">${esc(p.title)}</a>${sub}</td>
      <td class="tagcell">${p.tags.map(t => `<span>#${esc(t)}</span>`).join('')}</td>
      <td class="goal">${esc(g)}</td>
      <td class="tl">${esc(tl)}</td>
      <td class="doccell">${links}</td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table class="ptable"><thead><tr><th scope="col">期別</th><th scope="col">方案名</th><th scope="col">標籤</th><th scope="col">目標</th><th scope="col">時長 / 人力</th><th scope="col">方案紙・資料夾</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* ---------- home ---------- */
function viewHome() {
  $('band').innerHTML = `<div class="hero">
    <div class="mascot"><img src="${MASCOT}" alt="慈幼山友吉祥物"></div>
    <h1 class="rule-title">慈幼山友方案庫</h1>
    <p class="latin">NTUKKF</p>
    <div class="hero-btns"><a class="btn-ghost solid" href="#plans">方案庫</a></div>
  </div>`;
  $('view').innerHTML = '';
}

/* ---------- plan library ---------- */
function viewPlans() {
  $('band').innerHTML = `<div class="band"><h1 class="rule-title">方案庫</h1></div>`;
  $('view').innerHTML = `<main class="main hatch-light"><div class="wrap"><div class="lib">
    <a class="tile tile-all" href="#t-all" title="${esc(ALL.desc)}"><span class="lead"><h3>${ALL.name}</h3></span><span class="big"><b>${PLANS.length}</b><span>個方案</span></span></a>
    <nav class="tiles" aria-label="主題">${THEMES.map((t, i) => {
    const n = PLANS.filter(p => inTheme(p, t.key)).length;
    const shade = (i % 3 + Math.floor(i / 3)) % 3;
    return `<a class="tile s${shade}" href="#t-${t.key}" title="${esc(t.desc)}"><h3>${esc(t.name)}</h3><span class="big"><b>${n}</b><span>個方案</span></span></a>`;
  }).join('')}</nav></div></div></main>`;
}

/* ---------- theme page ---------- */
const TF = { key: '', q: '', type: '', sub: '' };
function subOptions(key, ps) {
  if (key === 'all') return { label: '分類', opts: THEMES.map(t => ({ v: t.key, name: t.name, n: ps.filter(p => inTheme(p, t.key)).length })) };
  if (key === 'other') return { label: '子分類', opts: SUBS.map(s => ({ v: s, name: s, n: ps.filter(p => p.subs.includes(s)).length })).filter(o => o.n) };
  return null;
}
function viewTheme(key) {
  const t = key === 'all' ? ALL : TH[key]; if (!t) { location.hash = '#plans'; return; }
  if (TF.key !== key) { TF.key = key; TF.q = ''; TF.type = ''; TF.sub = ''; }
  const ps = PLANS.filter(p => inTheme(p, key));
  const so = subOptions(key, ps);
  $('band').innerHTML = `<div class="band">
    <p class="crumb"><a href="#plans">方案庫</a> ／ ${esc(t.name)}</p>
    <h1 class="rule-title">${esc(t.name)}</h1></div>`;
  const types = ['平服', '假服', '校村運動會', '信望愛平服'].filter(x => ps.some(p => p.type === x));
  $('view').innerHTML = `<main class="main hatch-light"><div class="wrap" style="display:flex;flex-direction:column;gap:18px">
    <div class="filterbar">
      <div style="flex:2 1 280px;min-width:0"><label class="flabel" for="tq">在「${esc(t.name)}」裡搜尋</label><input id="tq" class="search" type="search" placeholder="方案名、標籤或目標" value="${esc(TF.q)}"></div>
      <div style="flex:3 1 340px;min-width:0"><span class="flabel">類型</span><div class="chips" id="t-types"></div></div>
      ${so ? `<div style="flex:1 1 100%;min-width:0"><span class="flabel">${so.label}</span><div class="chips" id="t-subs"></div></div>` : ''}
    </div>
    <p class="count" id="t-count"></p>
    <div id="t-table"></div>
  </div></main>`;
  $('tq').addEventListener('input', e => { TF.q = e.target.value; renderThemeTable(ps, types, so); });
  $('t-types').addEventListener('click', e => { const b = e.target.closest('[data-ty]'); if (!b) return; TF.type = TF.type === b.dataset.ty ? '' : b.dataset.ty; renderThemeTable(ps, types, so); });
  if (so) $('t-subs').addEventListener('click', e => { const b = e.target.closest('[data-sub]'); if (!b) return; TF.sub = TF.sub === b.dataset.sub ? '' : b.dataset.sub; renderThemeTable(ps, types, so); });
  renderThemeTable(ps, types, so);
}
function renderThemeTable(ps, types, so) {
  $('t-types').innerHTML = `<button type="button" class="chip" data-ty="" aria-pressed="${!TF.type}">全部</button>` + types.map(x => `<button type="button" class="chip" data-ty="${x}" aria-pressed="${TF.type === x}">${x}</button>`).join('');
  if (so) $('t-subs').innerHTML = `<button type="button" class="chip" data-sub="" aria-pressed="${!TF.sub}">全部</button>` + so.opts.map(o => `<button type="button" class="chip" data-sub="${esc(o.v)}" aria-pressed="${TF.sub === o.v}">${esc(o.name)} <small>${o.n}</small></button>`).join('');
  const q = TF.q.trim().toLowerCase();
  const inSub = p => !TF.sub || (TF.key === 'all' ? inTheme(p, TF.sub) : p.subs.includes(TF.sub));
  const list = ps.filter(p => (!TF.type || p.type === TF.type) && inSub(p) && (!q || [p.title, p.goal, p.tags.join(' ')].join(' ').toLowerCase().includes(q)));
  $('t-count').innerHTML = `共 <strong>${list.length}</strong> 個方案`;
  $('t-table').innerHTML = planTable(list);
}

/* ---------- plan detail ---------- */
function viewPlan(id) {
  const p = BY[id]; if (!p) { location.hash = '#plans'; return; }
  const t = TH[p.theme];
  $('band').innerHTML = `<div class="band">
    <p class="crumb"><a href="#plans">方案庫</a> ／ <a href="#t-${t.key}">${esc(t.name)}</a>${p.subs && p.subs.length ? '・' + p.subs.map(esc).join('、') : ''}${p.type === '信望愛平服' ? '　<a href="#t-xwa">信望愛</a>' : ''}</p>
    <h1 class="rule-title">${esc(p.title)}</h1>
    <div class="stats"><span>${termLabel(p.term)} · ${esc(p.type)}${p.site && p.site !== '瑞北' ? '（' + esc(p.site) + '）' : ''}</span>${p.mins ? `<span>${esc(p.mins)}</span>` : ''}${p.people ? `<span>${esc(p.people)}</span>` : ''}${p.term === 37 ? '<span>撰寫中</span>' : ''}</div></div>`;
  const others = PLANS.filter(x => x.theme === p.theme && x.id !== p.id).slice(0, 5);
  $('view').innerHTML = `<main class="main hatch-light"><div class="wrap cols">
    <div class="colmain">
      <section class="box"><h2>方案目標</h2><p>${esc(p.goal)}</p></section>
      ${p.tips.length ? `<section class="box"><h2>團本建議</h2><ul>${p.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>` : ''}
      ${p.tags.length ? `<section class="box"><h2>標籤</h2><div class="tagcell">${p.tags.map(x => `<span>#${esc(x)}</span>`).join('')}</div></section>` : ''}
    </div>
    <aside class="colside">
      ${p.sheet && p.sheet.url ? (p.sheet.kind === 'book'
        ? `<a class="btn-line alt doclink-btn" href="${esc(p.sheet.url)}" target="_blank" rel="noopener">${BOOK_ICON}<span>開啟方案本<small>這個方案沒有單獨的方案紙</small></span></a>`
        : `<a class="btn-line doclink-btn" href="${esc(p.sheet.url)}" target="_blank" rel="noopener">${DOC_ICON}<span>開啟方案紙</span></a>`) : ''}
      ${p.folder && p.folder.url ? (p.folder.kind === 'plan'
        ? `<a class="btn-line doclink-btn" href="${esc(p.folder.url)}" target="_blank" rel="noopener">${FOLDER_ICON}<span>開啟方案資料夾</span></a>`
        : `<a class="btn-line alt doclink-btn" href="${esc(p.folder.url)}" target="_blank" rel="noopener">${FOLDER_ICON}<span>開啟該期資料夾<small>這個方案沒有個別資料夾</small></span></a>`) : ''}
      <section class="box" style="gap:10px"><h2>同主題的其他方案</h2>
        ${others.map(o => `<a class="sim" href="#p-${o.id}"><b>${esc(o.title)}</b><span>${termLabel(o.term)} · ${esc(o.type)}${o.term === 37 ? ' · 撰寫中' : ''}</span></a>`).join('') || '<p>沒有其他同主題方案。</p>'}
        <a href="#t-${t.key}" style="font-size:14px">看「${esc(t.name)}」全部方案</a>
      </section>
    </aside></div></main>`;
}

/* ---------- router ---------- */
function route() {
  const h = location.hash.replace('#', '') || 'home';
  let nav = h;
  if (h.startsWith('p-')) { viewPlan(h.slice(2)); nav = 'plans'; }
  else if (h.startsWith('t-')) { viewTheme(h.slice(2)); nav = 'plans'; }
  else if (h === 'plans') viewPlans();
  else { viewHome(); nav = 'home'; }
  document.body.dataset.view = nav;
  document.querySelectorAll('[data-nav]').forEach(a => { if (a.dataset.nav === nav) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
